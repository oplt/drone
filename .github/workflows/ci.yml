name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff F821/F401 (agriculture)
        run: |
          python -m ruff check \
            --select F821,F401 \
            backend/modules/agriculture

      - name: Module port boundary guard
        run: python backend/scripts/check_module_ports.py

      - name: P2 static gates
        run: python backend/scripts/check_p2_static_gates.py

      - name: P4 research gates
        run: python backend/scripts/check_p4_research_gates.py

      - name: Focused pytest suites
        run: |
          python -m pytest -q \
            -p pytest_asyncio.plugin \
            backend/tests/test_p0_safe_vertical_slice.py \
            backend/tests/test_p1_operable_workflow.py \
            backend/tests/test_p2_agriculture_vertical_slice.py \
            backend/tests/test_release_policy.py \
            backend/tests/test_video_detection_scale.py \
            backend/tests/test_module_ports.py \
            backend/tests/test_stor_vid_provenance.py \
            backend/tests/test_vision_storage_object.py \
            backend/tests/test_p4_research_gates.py \
            backend/tests/test_exp001_research_suite.py \
            backend/tests/test_exp002_research_suite.py
        # No Postgres service: skip heavy migration/integration suites here.

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (CI baseline)
        run: npm run lint:ci

      - name: Unit tests (agriculture field setup)
        run: |
          npx vitest run \
            src/modules/agriculture/components/AgricultureFieldSetupWizard.test.tsx \
            src/modules/agriculture/components/AgricultureGeometryMapEditor.test.tsx

      - name: Production build
        run: npm run build
